<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hakma — Learn anything. Master everything.</title>
<meta name="description" content="Hakma is a monster-collecting RPG where every battle is a lesson. Choose a topic — Kubernetes, Python, Go, physics, math and more — and master it by the end of the game.">
<meta name="theme-color" content="#120a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="384" height="216"></canvas>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="banner"></div>
    <div id="toasts"></div>
    <div id="fade"></div>
    <div id="boot">HAKMA<small>loading…</small></div>
  </div>
  <div id="touch" aria-hidden="true">
    <div id="dpad"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div>
    <button data-b="start" class="menu">MENU</button>
    <button data-b="b" class="b">B</button>
    <button data-b="a" class="a">A</button>
  </div>
  <noscript>Hakma needs JavaScript to run.</noscript>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
